<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Рабочий журнал</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--bg:#080c14;--surface:#0f1624;--surface2:#161e30;--border:#1e2a3d;--border2:#243147;--text:#e2e8f0;--muted:#4a5a72;--dim:#2d3f58;--blue:#3b82f6;--cyan:#06b6d4;--green:#22c55e;--orange:#f97316;--red:#ef4444;--purple:#a78bfa;--yellow:#eab308;--radius:14px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:100px}
.topbar{background:rgba(8,12,20,.95);border-bottom:1px solid var(--border);padding:14px 16px;position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between}
.topbar h1{font-size:17px;font-weight:700}
.topbar p{font-size:11px;color:var(--muted);margin-top:1px}
.tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:65px;z-index:99}
.tab{flex:1;padding:12px 8px;text-align:center;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
.tab.active{color:var(--cyan);border-bottom-color:var(--cyan)}
.content{padding:16px;max-width:520px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.card-date{font-size:15px;font-weight:700}
.card-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:8px}
.section{margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.section:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.slabel{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.field input,.field select{background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:9px 10px;color:var(--text);font-size:14px;font-family:inherit;outline:none;width:100%}
.field input:focus{border-color:var(--blue)}
.field select option{background:#161e30}
.obj-block{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px}
.obj-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.obj-num{font-size:10px;font-weight:700;color:var(--muted)}
.obj-badge{font-size:11px;color:var(--cyan);font-weight:600}
.btn{cursor:pointer;font-family:inherit;font-weight:600;border-radius:9px}
.btn-primary{background:linear-gradient(135deg,#1d4ed8,#3b82f6);color:#fff;border:none;padding:11px 18px;font-size:13px}
.btn-ghost{background:none;border:1px solid var(--border2);color:var(--muted);padding:5px 10px;font-size:11px}
.btn-danger{background:none;border:none;color:#ef444460;font-size:14px;padding:4px;cursor:pointer}
.btn-add{background:#0c2040;border:1px solid rgba(59,130,246,.3);color:var(--blue);padding:7px 12px;font-size:12px;border-radius:8px;cursor:pointer;font-family:inherit;font-weight:600}
.result-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border);font-size:13px}
.result-row:last-child{border-bottom:none}
.result-label{color:var(--muted)}
.result-val{font-weight:600}
.over-box{margin-top:10px;padding:10px 14px;border-radius:9px}
.summary-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 10px;margin-bottom:16px}
.strip-cell{text-align:center}
.strip-val{font-size:15px;font-weight:700}
.strip-lbl{font-size:10px;color:var(--muted);margin-top:2px}
.month-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.month-nav{background:var(--surface2);border:1px solid var(--border2);color:var(--text);border-radius:8px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px}
.month-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat-box{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.stat-box .val{font-size:20px;font-weight:700}
.stat-box .lbl{font-size:11px;color:var(--muted);margin-top:3px}
.day-row{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;cursor:pointer}
.day-row-date{font-size:13px;font-weight:700;min-width:50px}
.day-row-body{flex:1}
.day-row-hours{font-size:13px;font-weight:600;color:var(--cyan)}
.day-row-sub{font-size:11px;color:var(--muted);margin-top:2px}
.day-row-over{font-size:12px;font-weight:700;min-width:55px;text-align:right}
.empty{text-align:center;padding:48px 24px;color:var(--muted)}
.empty-icon{font-size:48px;margin-bottom:12px}
.empty-text{font-size:14px}
.fab{position:fixed;bottom:24px;right:20px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#1d4ed8,#3b82f6);border:none;color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(59,130,246,.5);cursor:pointer;z-index:200}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:300;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.open{opacity:1;pointer-events:all}
.sheet{background:var(--surface);border-radius:20px 20px 0 0;padding:20px 16px 40px;width:100%;max-height:90vh;overflow-y:auto;transform:translateY(40px);transition:transform .25s}
.overlay.open .sheet{transform:translateY(0)}
.handle{width:40px;height:4px;background:var(--dim);border-radius:4px;margin:0 auto 16px}
.sheet-title{font-size:17px;font-weight:700;margin-bottom:16px}
.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.action-btn{padding:14px 8px;border-radius:10px;border:none;font-family:inherit;font-weight:600;font-size:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}
.action-btn .ico{font-size:24px}
.ab-orange{background:#1a0e04;border:1px solid rgba(249,115,22,.4);color:var(--orange)}
.ab-purple{background:#120c1f;border:1px solid rgba(167,139,250,.4);color:var(--purple)}
.ab-blue{background:#0c2040;border:1px solid rgba(59,130,246,.4);color:var(--blue)}
.ab-green{background:#052010;border:1px solid rgba(34,197,94,.4);color:var(--green)}
.period-wrap{border-top:1px solid var(--border);padding-top:14px;margin-top:4px}
.ptabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.ptab{padding:7px 12px;border-radius:8px;border:1px solid var(--border2);background:none;color:var(--muted);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer}
.ptab.active{background:var(--blue);border-color:var(--blue);color:#fff}
.fullscreen{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;flex-direction:column}
.fs-bar{background:#1d4ed8;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.fs-bar-title{color:#fff;font-weight:700;font-size:15px}
.fs-btn{background:rgba(255,255,255,.2);color:#fff;border:none;padding:8px 14px;border-radius:8px;font-weight:700;font-size:12px;cursor:pointer;font-family:inherit}
.fs-btn-white{background:#fff;color:#1d4ed8;border:none;padding:8px 14px;border-radius:8px;font-weight:700;font-size:12px;cursor:pointer;font-family:inherit}
.dtype-btn{padding:10px 4px;border-radius:10px;border:2px solid var(--border2);background:var(--surface2);color:var(--muted);font-family:inherit;font-size:11px;font-weight:600;cursor:pointer;text-align:center;transition:all .15s}
.photos-wrap{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.photo-thumb{width:72px;height:72px;border-radius:8px;object-fit:cover;border:1px solid var(--border);cursor:pointer}
.photo-add{width:72px;height:72px;border-radius:8px;border:2px dashed var(--border2);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);font-size:24px;background:var(--bg)}
.photo-del{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.7);border:none;color:#fff;border-radius:50%;width:20px;height:20px;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.photo-wrap{position:relative;display:inline-block}
.photo-viewer{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:9999;display:flex;align-items:center;justify-content:center}
.photo-viewer img{max-width:95vw;max-height:90vh;border-radius:8px}
.photo-viewer-close{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:50%;width:36px;height:36px;font-size:18px;cursor:pointer}
.login-screen{position:fixed;inset:0;background:var(--bg);z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px}
.login-logo{font-size:64px;margin-bottom:16px}
.login-title{font-size:22px;font-weight:700;margin-bottom:8px;text-align:center}
.login-sub{font-size:14px;color:var(--muted);text-align:center;margin-bottom:32px;line-height:1.6}
.login-btn{background:linear-gradient(135deg,#1d4ed8,#3b82f6);color:#fff;border:none;padding:14px 32px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.login-note{font-size:11px;color:var(--muted);text-align:center;margin-top:16px;line-height:1.6}
.dtype-badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;margin-left:8px;vertical-align:middle}
input[type=date]::-webkit-calendar-picker-indicator,input[type=time]::-webkit-calendar-picker-indicator{filter:invert(.5)}
@media print{
  body>*{display:none!important}
  #fs-report{display:flex!important;position:static!important;height:auto!important;overflow:visible!important;background:#fff!important;flex-direction:column}
  #fs-report .fs-bar{display:none!important}
  #fs-report>div{overflow:visible!important;height:auto!important;flex:none!important}
  #fs-report table{page-break-inside:auto}
  #fs-report tr{page-break-inside:avoid}
  #fs-report>div>div[style*="margin-bottom:20px"]{page-break-inside:avoid}
}
</style>
</head>

<script>
var CLIENT_ID = '796026241753-bahbqfi6ac8m28g9dahjofbae68jh3jh.apps.googleusercontent.com';
var SCOPES = 'https://www.googleapis.com/auth/drive.appdata';
var FILE_NAME = 'work-journal-data.json';
var NORM = 480;

var data = [];
var curTab = 'today';
var editId = null;
var curMonth = new Date().getMonth();
var curYear = new Date().getFullYear();
var curPeriod = 'month';
var formState = null;
var accessToken = null;
var driveFileId = null;
var saveTimer = null;
var photoTargetDayId = null;
var photoTargetObjId = null;

var DTYPE = {
  work:      { label: 'Рабочий',        icon: '💼', color: 'var(--cyan)'   },
  trip:      { label: 'Командировка',   icon: '🚀', color: 'var(--blue)'   },
  tripnight: { label: 'Ночёвка',        icon: '🏨', color: 'var(--yellow)' },
  rest:      { label: 'Выходной',       icon: '🌿', color: 'var(--green)'  },
  sick:      { label: 'Больничный',     icon: '🤒', color: 'var(--orange)' },
  vacation:  { label: 'Отпуск',         icon: '🌴', color: 'var(--purple)' }
};

// ---- RATES ----
var RATES = {
  overtime: parseFloat(localStorage.getItem('rate_overtime') || '12'),
  trip:     parseFloat(localStorage.getItem('rate_trip')     || '28'),
  tripnight:parseFloat(localStorage.getItem('rate_tripnight')|| '28')
};

function saveRates() {
  localStorage.setItem('rate_overtime',  RATES.overtime);
  localStorage.setItem('rate_trip',      RATES.trip);
  localStorage.setItem('rate_tripnight', RATES.tripnight);
}

function calcEarnings(days) {
  var overMin = 0, trips = 0, tripnights = 0;
  days.forEach(function(d) {
    var cv = calcDay(d);
    var dtype = d.dtype || 'work';
    if (isWorkDay(dtype) && cv.over > 0) overMin += cv.over;
    if (dtype === 'trip')      trips++;
    if (dtype === 'tripnight') tripnights++;
  });
  var overPay  = Math.round((overMin / 60) * RATES.overtime * 100) / 100;
  var tripPay  = trips      * RATES.trip;
  var nightPay = tripnights * RATES.tripnight;
  var total    = Math.round((overPay + tripPay + nightPay) * 100) / 100;
  return { overMin:overMin, trips:trips, tripnights:tripnights, overPay:overPay, tripPay:tripPay, nightPay:nightPay, total:total };
}

function isWorkDay(dtype) {
  return dtype === 'work' || dtype === 'trip' || dtype === 'tripnight';
}

// ---- INIT ----
document.getElementById('topDate').textContent = new Date().toLocaleDateString('ru-RU', {weekday:'long', day:'numeric', month:'long'});

document.getElementById('signin-btn').onclick = signIn;
document.getElementById('signout-btn').onclick = signOut;
document.getElementById('newday-btn').onclick = openNewDay;
document.getElementById('fab-btn').onclick = openNewDay;
document.getElementById('export-btn').onclick = openExport;
document.getElementById('ex-close').onclick = closeExport;
document.getElementById('tab-today').onclick = function(){ switchTab('today'); };
document.getElementById('tab-month').onclick = function(){ switchTab('month'); };
document.getElementById('tab-all').onclick = function(){ switchTab('all'); };
document.getElementById('rep-print').onclick = function(){ doReport('print', false); };
document.getElementById('rep-share').onclick = function(){ doReport('share', false); };
document.getElementById('rep-print-photo').onclick = function(){ doReport('print', true); };
document.getElementById('rep-share-photo').onclick = function(){ doReport('share', true); };
document.getElementById('photo-input').onchange = onPhotoSelected;
document.getElementById('rates-btn').onclick = openRates;
document.getElementById('rates-close').onclick = closeRates;
document.getElementById('rates-overlay').onclick = function(e){ if(e.target===this) closeRates(); };
document.getElementById('rates-save').onclick = saveRatesForm;
document.getElementById('day-overlay').onclick = function(e){ if(e.target === this) closeDayOverlay(); };
document.getElementById('ex-overlay').onclick = function(e){ if(e.target === this) closeExport(); };

document.querySelectorAll('.ptab').forEach(function(btn) {
  btn.onclick = function() {
    curPeriod = this.getAttribute('data-period');
    document.querySelectorAll('.ptab').forEach(function(b){ b.classList.remove('active'); });
    this.classList.add('active');
    document.getElementById('custom-range').style.display = curPeriod === 'custom' ? 'block' : 'none';
    updatePeriodInfo();
  };
});

// ---- RATES MODAL ----
function openRates() {
  document.getElementById('rate-overtime').value  = RATES.overtime;
  document.getElementById('rate-trip').value      = RATES.trip;
  document.getElementById('rate-tripnight').value = RATES.tripnight;

}
function closeRates() { document.getElementById('rates-overlay').classList.remove('open'); }
function saveRatesForm() {

// ---- AUTH ----
function signIn() {
  var client = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPES,
    callback: function(resp) {
      if (resp.error) { alert('Ошибка входа: ' + resp.error); return; }
      accessToken = resp.access_token;
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      loadFromDrive();
    }
  });
  client.requestAccessToken();
}

function signOut() {
  if (!confirm('Выйти?')) return;
  accessToken = null; driveFileId = null; data = [];
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
}

// ---- DRIVE ----
function setSyncStatus(msg, col) {
  var el = document.getElementById('sync-status');
  el.textContent = msg;
  el.style.color = col || 'var(--muted)';
}

function loadFromDrive() {
  setSyncStatus('⟳ Загрузка...', 'var(--cyan)');
  fetch('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=files(id,name)&q=name%3D%22' + FILE_NAME + '%22', {
    headers: { 'Authorization': 'Bearer ' + accessToken }
  })
  .then(function(r) { return r.json(); })
  .then(function(res) {
    if (res.files && res.files.length > 0) {
      driveFileId = res.files[0].id;
      return fetch('https://www.googleapis.com/drive/v3/files/' + driveFileId + '?alt=media', {
        headers: { 'Authorization': 'Bearer ' + accessToken }
      }).then(function(r) { return r.json(); });
    }
    return null;
  })
  .then(function(d) {
    if (d && Array.isArray(d)) data = d;
    setSyncStatus('✓ Синхронизировано');
    render();
  })
  .catch(function(e) { setSyncStatus('⚠ Ошибка'); render(); });
}

function save() {
  if (!accessToken) return;
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, 1000);
}

function doSave() {
  setSyncStatus('⟳ Сохранение...', 'var(--cyan)');
  var json = JSON.stringify(data);
  if (driveFileId) {
    fetch('https://www.googleapis.com/upload/drive/v3/files/' + driveFileId + '?uploadType=media', {
      method: 'PATCH',
      headers: { 'Authorization': 'Bearer ' + accessToken, 'Content-Type': 'application/json' },
      body: json
    }).then(function() { setSyncStatus('✓ Сохранено'); }).catch(function() { setSyncStatus('⚠ Ошибка'); });
  } else {
    var meta = JSON.stringify({ name: FILE_NAME, parents: ['appDataFolder'] });
    var form = new FormData();
    form.append('metadata', new Blob([meta], { type: 'application/json' }));
    form.append('file', new Blob([json], { type: 'application/json' }));
    fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + accessToken },
      body: form
    }).then(function(r) { return r.json(); }).then(function(res) {
      driveFileId = res.id; setSyncStatus('✓ Сохранено');
    }).catch(function() { setSyncStatus('⚠ Ошибка'); });
  }
}

// ---- HELPERS ----
function toMin(t) { if (!t) return 0; var p = t.split(':'); return parseInt(p[0]) * 60 + parseInt(p[1]); }
function hm(m) { if (!m || m <= 0) return '0ч 0м'; return Math.floor(Math.abs(m) / 60) + 'ч ' + (Math.abs(m) % 60) + 'м'; }
function hmsign(m) { if (m === 0) return '0'; return (m > 0 ? '+' : '-') + hm(Math.abs(m)); }
function fmtDate(s) { if (!s) return ''; return new Date(s + 'T00:00:00').toLocaleDateString('ru-RU', {weekday:'short', day:'numeric', month:'short'}); }
function fmtDateFull(s) { if (!s) return ''; return new Date(s + 'T00:00:00').toLocaleDateString('ru-RU', {day:'numeric', month:'long', year:'numeric'}); }
function pad2(n) { return String(n).padStart(2, '0'); }
function eid(id) { return document.getElementById(id); }

function calcDay(d) {
  var dtype = d.dtype || 'work';
  if (!isWorkDay(dtype)) return { work:0, over:0, objMin:0, road:0, lunch:0, objKm:0 };
  var total = (d.dayStart && d.dayEnd) ? toMin(d.dayEnd) - toMin(d.dayStart) : 0;
  var lunch = (d.lunchStart && d.lunchEnd) ? toMin(d.lunchEnd) - toMin(d.lunchStart) : 0;
  var work = total - lunch;
  var objMin = (d.objects || []).reduce(function(s, o) { return s + ((o.ts && o.te) ? toMin(o.te) - toMin(o.ts) : 0); }, 0);
  var objKm = (d.objects || []).reduce(function(s, o) { return s + (parseFloat(o.km) || 0); }, 0);
  var road = parseInt(d.roadMin) || 0;
  return { work: work, over: work - NORM, objMin: objMin, road: road, lunch: lunch, objKm: objKm };
}

// ---- TABS ----
function switchTab(t) {
  curTab = t;
  ['today','month','all'].forEach(function(x) { eid('tab-' + x).classList.remove('active'); });
  eid('tab-' + t).classList.add('active');
  render();
}

// ---- RENDER ----
function render() {
  var c = eid('content');
  if (curTab === 'today') renderToday(c);
  else if (curTab === 'month') renderMonth(c);
  else renderAll(c);
}

function renderToday(c) {
  var today = new Date().toISOString().slice(0, 10);
  var d = data.find(function(x) { return x.date === today; });
  if (!d) { c.innerHTML = '<div class="empty"><div class="empty-icon">📅</div><div class="empty-text">Сегодня записей нет.<br>Нажми + чтобы начать</div></div>'; return; }
  c.innerHTML = renderCard(d);
}

function renderAll(c) {
  if (!data.length) { c.innerHTML = '<div class="empty"><div class="empty-icon">📂</div><div class="empty-text">Нет записей</div></div>'; return; }
  var sorted = data.slice().sort(function(a, b) { return b.date.localeCompare(a.date); });
  var tot = sorted.reduce(function(a, d) { var cv = calcDay(d); a.work += cv.work; a.over += cv.over; a.km += (d.objects||[]).reduce(function(s,o){return s+(parseFloat(o.km)||0);},0); a.road += cv.road; return a; }, { work:0, over:0, km:0, road:0 });
  var oc = tot.over > 0 ? 'var(--orange)' : tot.over < 0 ? 'var(--red)' : 'var(--green)';
  var html = '<div class="summary-strip">'
    + '<div class="strip-cell"><div class="strip-val" style="color:var(--cyan)">' + hm(tot.work) + '</div><div class="strip-lbl">Часов</div></div>'
    + '<div class="strip-cell"><div class="strip-val" style="color:' + oc + '">' + hmsign(tot.over) + '</div><div class="strip-lbl">Переработка</div></div>'
    + '<div class="strip-cell"><div class="strip-val" style="color:var(--orange)">' + Math.round(tot.km) + '</div><div class="strip-lbl">Км</div></div>'
    + '<div class="strip-cell"><div class="strip-val" style="color:var(--purple)">' + hm(tot.road) + '</div><div class="strip-lbl">В дороге</div></div>'
    + '</div>';
  sorted.forEach(function(d) { html += renderCard(d); });
  c.innerHTML = html;
}

function renderMonth(c) {
  var MN = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  var days = data.filter(function(d) {
    var dt = new Date(d.date + 'T00:00:00');
    return dt.getMonth() === curMonth && dt.getFullYear() === curYear;
  }).sort(function(a, b) { return b.date.localeCompare(a.date); });

  var tot = days.reduce(function(a, d) {
    var cv = calcDay(d);
    a.work += cv.work; a.over += cv.over;
    a.km += (d.objects||[]).reduce(function(s,o){return s+(parseFloat(o.km)||0);},0);
    return a;
  }, { work:0, over:0, km:0 });

  var oc = tot.over > 0 ? 'var(--orange)' : tot.over < 0 ? 'var(--red)' : 'var(--green)';

  var html = '<div class="month-header">'
    + '<button class="month-nav" onclick="prevMonth()">‹</button>'
    + '<div style="font-size:16px;font-weight:700">' + MN[curMonth] + ' ' + curYear + '</div>'
    + '<button class="month-nav" onclick="nextMonth()">›</button>'
    + '</div>'
    + '<div class="month-stats">'
    + '<div class="stat-box"><div class="val" style="color:var(--cyan)">' + hm(tot.work) + '</div><div class="lbl">Рабочих часов</div></div>'
    + '<div class="stat-box"><div class="val" style="color:' + oc + '">' + hmsign(tot.over) + '</div><div class="lbl">Переработка</div></div>'
    + '<div class="stat-box"><div class="val" style="color:var(--orange)">' + Math.round(tot.km) + ' км</div><div class="lbl">Пробег</div></div>'
    + '<div class="stat-box"><div class="val" style="color:var(--muted)">' + days.length + '</div><div class="lbl">Всего дней</div></div>'
    + '</div>';

  if (!days.length) {
    html += '<div class="empty"><div class="empty-icon">📅</div><div class="empty-text">Нет записей за этот месяц</div></div>';
  } else {
    days.forEach(function(d) {
      var cv = calcDay(d);
      var dtype = d.dtype || 'work';
      var dtCfg = DTYPE[dtype];
      var iw = isWorkDay(dtype);
      var rowOc = iw ? (cv.over > 0 ? 'var(--orange)' : cv.over < 0 ? 'var(--red)' : 'var(--green)') : dtCfg.color;
      var objs = iw ? (d.objects||[]).filter(function(o){return o.name;}).map(function(o){return o.name;}).join(', ') : '';
      var dKm = (d.objects||[]).reduce(function(s,o){return s+(parseFloat(o.km)||0);},0);
      var photoCount = iw ? (d.objects||[]).reduce(function(s,o){return s+(o.photos||[]).length;},0) : 0;
      html += '<div class="day-row" onclick="goDay(\'' + d.id + '\')">'
        + '<div class="day-row-date">' + new Date(d.date + 'T00:00:00').toLocaleDateString('ru-RU', {day:'numeric', month:'short'}) + '</div>'
        + '<div class="day-row-body">'
        + '<div class="day-row-hours" style="color:' + dtCfg.color + '">' + dtCfg.icon + ' ' + (iw ? hm(cv.work) : dtCfg.label) + '</div>'
        + (objs ? '<div class="day-row-sub">' + objs + '</div>' : '')
        + (dKm > 0 ? '<div class="day-row-sub" style="color:var(--orange)">🚗 ' + dKm + ' км</div>' : '')
        + (photoCount ? '<div class="day-row-sub">📷 ' + photoCount + ' фото</div>' : '')
        + '</div>'
        + '<div class="day-row-over" style="color:' + rowOc + '">' + (iw && cv.over !== 0 ? hmsign(cv.over) : '✓') + '</div>'
        + '</div>';
    });
  }
  c.innerHTML = html;
}

function prevMonth() { curMonth--; if (curMonth < 0) { curMonth = 11; curYear--; } render(); }
function nextMonth() { curMonth++; if (curMonth > 11) { curMonth = 0; curYear++; } render(); }
function goDay(id) { switchTab('all'); setTimeout(function(){ var el = eid('card-' + id); if (el) el.scrollIntoView({behavior:'smooth', block:'start'}); }, 100); }

// ---- INLINE EDIT ----
function updDay(id, field, val) { var d = data.find(function(x){return x.id===id;}); if (d) { d[field] = val; save(); reCard(id); } }
function updObj(dayId, objId, field, val) { var d = data.find(function(x){return x.id===dayId;}); if (d) { var o = d.objects.find(function(x){return x.id===objId;}); if (o) { o[field] = val; save(); reCard(dayId); } } }
function addObj(dayId) { var d = data.find(function(x){return x.id===dayId;}); if (d) { d.objects.push({id:Date.now()+'',name:'',ts:'',te:'',km:'',note:'',photos:[]}); save(); reCard(dayId); } }
function reCard(id) { var d = data.find(function(x){return x.id===id;}); if (!d) return; var el = eid('card-' + id); if (el) { var tmp = document.createElement('div'); tmp.innerHTML = renderCard(d); el.replaceWith(tmp.firstChild); } }
function delDay(id) { if (!confirm('Удалить этот день?')) return; data = data.filter(function(x){return x.id!==id;}); save(); render(); }

// ---- PHOTOS ----
function addPhoto(dayId, objId) { photoTargetDayId = dayId; photoTargetObjId = objId; eid('photo-input').click(); }

function onPhotoSelected(e) {
  var files = Array.from(e.target.files);
  if (!files.length) return;
  var d = data.find(function(x){return x.id===photoTargetDayId;});
  if (!d) return;
  var o = d.objects.find(function(x){return x.id===photoTargetObjId;});
  if (!o) return;
  if (!o.photos) o.photos = [];
  var processed = 0;
  files.forEach(function(file) {
    var reader = new FileReader();
    reader.onload = function(ev) {
      var img = new Image();
      img.onload = function() {
        var canvas = document.createElement('canvas');
        var max = 800; var w = img.width; var h = img.height;
        if (w > max) { h = Math.round(h * max / w); w = max; }
        if (h > max) { w = Math.round(w * max / h); h = max; }
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        o.photos.push(canvas.toDataURL('image/jpeg', 0.7));
        processed++;
        if (processed === files.length) { save(); reCard(photoTargetDayId); }
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
  e.target.value = '';
}

function delPhoto(dayId, objId, idx) {
  var d = data.find(function(x){return x.id===dayId;});
  if (!d) return;
  var o = d.objects.find(function(x){return x.id===objId;});
  if (!o || !o.photos) return;
  o.photos.splice(idx, 1); save(); reCard(dayId);
}

function viewPhoto(src) {
  var v = document.createElement('div');
  v.className = 'photo-viewer';
  v.innerHTML = '<img src="' + src + '"><button class="photo-viewer-close" onclick="this.parentElement.remove()">✕</button>';
  v.onclick = function(e) { if (e.target === v) v.remove(); };
  document.body.appendChild(v);
}

function openNewDay() {
  editId = null;
  var today = new Date().toISOString().slice(0, 10);
  formState = { id: Date.now() + '', date: today, dtype: 'work', dayStart: '', dayEnd: '', lunchStart: '', lunchEnd: '', roadKm: '', roadMin: '', note: '', objects: [{ id: Date.now() + 'x', name: '', ts: '', te: '', km: '', note: '', photos: [] }] };
  eid('day-title').textContent = 'Новый день';
  eid('day-overlay').classList.add('open');

}

function editDay(id) {

function fObj(id, field, val) { var o = formState.objects.find(function(x){return x.id===id;}); if (o) o[field] = val; }
function addFormObj() { formState.objects.push({id:Date.now()+'fo',name:'',ts:'',te:'',km:'',note:'',photos:[]}); renderForm(); }
function rmFormObj(id) { if (formState.objects.length <= 1) return; formState.objects = formState.objects.filter(function(o){return o.id!==id;}); renderForm(); }

function saveDay() {
  if (editId) {
    var idx = data.findIndex(function(x){return x.id===editId;});
    if (idx >= 0) data[idx] = formState;
  } else {
    var exists = data.findIndex(function(x){return x.date===formState.date;});
    if (exists >= 0) {
      var fmt = new Date(formState.date + 'T00:00:00').toLocaleDateString('ru-RU', {day:'numeric', month:'long'});
      if (!confirm('За ' + fmt + ' уже есть запись!\nСтарые данные будут заменены. Продолжить?')) return;
      data[exists] = formState;
    } else { data.push(formState); }
  }
  save();
  eid('day-overlay').classList.remove('open');
  var today = new Date().toISOString().slice(0, 10);
  if (formState.date === today) switchTab('today'); else render();
}

function openExport() { updatePeriodInfo(); eid('ex-overlay').classList.add('open'); }

function getPeriodDays() {
  var now = new Date();
  var from, toD = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  if (curPeriod === 'month') from = new Date(now.getFullYear(), now.getMonth(), 1);
  else if (curPeriod === '3m') from = new Date(now.getFullYear(), now.getMonth() - 2, 1);
  else if (curPeriod === '6m') from = new Date(now.getFullYear(), now.getMonth() - 5, 1);
  else if (curPeriod === 'year') from = new Date(now.getFullYear(), 0, 1);
  else {
    var f = eid('range-from').value; var t2 = eid('range-to').value;
    if (!f || !t2) { alert('Укажи период'); return null; }
    from = new Date(f + 'T00:00:00'); toD = new Date(t2 + 'T00:00:00');
  }
  var fs = from.toISOString().slice(0, 10); var ts = toD.toISOString().slice(0, 10);
  return data.filter(function(d){return d.date >= fs && d.date <= ts;}).sort(function(a,b){return a.date.localeCompare(b.date);});
}

function updatePeriodInfo() {
  var days = getPeriodDays(); var el = eid('period-info'); if (!el || !days) return;
  var tot = days.reduce(function(a,d){var cv=calcDay(d);a.work+=cv.work;a.over+=cv.over;a.km+=(d.objects||[]).reduce(function(s,o){return s+(parseFloat(o.km)||0);},0);return a;},{work:0,over:0,km:0});
  el.textContent = 'Дней: ' + days.length + ' · ' + hm(tot.work) + ' · Переработка: ' + hmsign(tot.over) + ' · ' + Math.round(tot.km) + ' км';
}

function doReport(mode, withPhotos) {

  var MN = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];

  var cnt = countTypes(days);

  if (mode === 'share') {
    var txt = 'РАБОЧИЙ ЖУРНАЛ\n' + f + ' — ' + t2 + '\n' + '—'.repeat(30) + '\n';
    txt += 'Дней: ' + days.length + '\nЧасов: ' + hm(tot.work) + '\nПереработка: ' + hmsign(tot.over) + '\nПробег: ' + Math.round(tot.km) + ' км\n';
    txt += typeStatsTxt(cnt) + '\n';
    txt += earningsTxt(days);
    days.forEach(function(d) {
      var cv = calcDay(d); var dtype = d.dtype || 'work'; var dtCfg = DTYPE[dtype];
      var dt = new Date(d.date + 'T00:00:00').toLocaleDateString('ru-RU', {day:'numeric', month:'short'});
      if (!isWorkDay(dtype)) { txt += dt + ': ' + dtCfg.icon + ' ' + dtCfg.label + '\n'; }
      else {
        var objs = (d.objects||[]).filter(function(o){return o.name;}).map(function(o){return o.name;}).join(', ');
        var dkm = (d.objects||[]).reduce(function(s,o){return s+(parseFloat(o.km)||0);},0);
        txt += dt + ': ' + hm(cv.work) + (cv.over > 0 ? ' (+' + hm(cv.over) + ')' : cv.over < 0 ? ' (-' + hm(Math.abs(cv.over)) + ')' : '') + (dkm > 0 ? ' · ' + dkm + 'км' : '') + (objs ? ' · ' + objs : '') + '\n';
      }
    });
    if (navigator.share) { navigator.share({title:'Рабочий журнал', text:txt}).catch(function(){copyText(txt);}); }
    else { copyText(txt); }
    return;
  }

  var byMonth = {};
  days.forEach(function(d) {
    var dt = new Date(d.date + 'T00:00:00'); var key = dt.getFullYear() + '-' + pad2(dt.getMonth());

    + '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:#f5f5f5;border-radius:8px;padding:12px;margin-bottom:16px">'
    + '<div style="text-align:center"><div style="font-size:16px;font-weight:700;color:#1d4ed8">' + days.length + '</div><div style="font-size:10px;color:#666">Дней</div></div>'
    + '<div style="text-align:center"><div style="font-size:16px;font-weight:700;color:#1d4ed8">' + hm(tot.work) + '</div><div style="font-size:10px;color:#666">Часов</div></div>'
    + '<div style="text-align:center"><div style="font-size:16px;font-weight:700;color:' + (tot.over > 0 ? '#c2410c' : '#166534') + '">' + hmsign(tot.over) + '</div><div style="font-size:10px;color:#666">Переработка</div></div>'

  var fs = document.createElement('div');

  var pst = document.getElementById('report-print-style');
  if (!pst) {
    pst = document.createElement('style');
    pst.id = 'report-print-style';
    document.head.appendChild(pst);
  }

  fs.innerHTML = '<div class="fs-bar" id="report-fs-bar"><span class="fs-bar-title">📋 Отчёт' + (withPhotos ? ' с фото' : '') + '</span>'
    + '<div style="display:flex;gap:8px">'
    + '<button class="fs-btn-white" onclick="window.print()">🖨️ Печать/PDF</button>'
    + '<button class="fs-btn" onclick="document.getElementById(\'fs-report\').remove()">✕</button>'
    + '</div></div><div id="report-scroll" style="overflow-y:auto;flex:1">' + html + '</div>';
  document.body.appendChild(fs);
}

function copyText(txt) {
  if (navigator.clipboard) { navigator.clipboard.writeText(txt).then(function(){ alert('Скопировано!'); }).catch(function(){ fbCopy(txt); }); }
  else { fbCopy(txt); }
}
function fbCopy(txt) { var ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); alert('Скопировано!'); }
</script>
</body>
