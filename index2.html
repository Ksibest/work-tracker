<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Рабочий журнал</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--bg:#080c14;--surface:#0f1624;--surface2:#161e30;--border:#1e2a3d;--border2:#243147;--text:#e2e8f0;--muted:#4a5a72;--dim:#2d3f58;--blue:#3b82f6;--cyan:#06b6d4;--green:#22c55e;--orange:#f97316;--red:#ef4444;--purple:#a78bfa;--radius:14px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:100px}
.topbar{background:rgba(8,12,20,.95);border-bottom:1px solid var(--border);padding:14px 16px;position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between}
.topbar h1{font-size:17px;font-weight:700}
.topbar p{font-size:11px;color:var(--muted);margin-top:1px}
.tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:65px;z-index:99}
.tab{flex:1;padding:12px 8px;text-align:center;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
.tab.active{color:var(--cyan);border-bottom-color:var(--cyan)}
.content{padding:16px;max-width:520px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.card-date{font-size:15px;font-weight:700}
.card-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:8px}
.section{margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.section:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.slabel{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.field input{background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:9px 10px;color:var(--text);font-size:14px;font-family:inherit;outline:none;width:100%}
.field input:focus{border-color:var(--blue)}
.obj-block{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px}
.obj-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.obj-num{font-size:10px;font-weight:700;color:var(--muted)}
.obj-badge{font-size:11px;color:var(--cyan);font-weight:600}
.btn{cursor:pointer;font-family:inherit;font-weight:600;border-radius:9px}
.btn-primary{background:linear-gradient(135deg,#1d4ed8,#3b82f6);color:#fff;border:none;padding:11px 18px;font-size:13px}
.btn-ghost{background:none;border:1px solid var(--border2);color:var(--muted);padding:5px 10px;font-size:11px}
.btn-danger{background:none;border:none;color:#ef444460;font-size:14px;padding:4px;cursor:pointer}
.btn-add{background:#0c2040;border:1px solid rgba(59,130,246,.3);color:var(--blue);padding:7px 12px;font-size:12px;border-radius:8px;cursor:pointer;font-family:inherit;font-weight:600}
.result-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border);font-size:13px}
.result-row:last-child{border-bottom:none}
.result-label{color:var(--muted)}
.result-val{font-weight:600}
.over-box{margin-top:10px;padding:10px 14px;border-radius:9px}
.summary-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 10px;margin-bottom:16px}
.strip-cell{text-align:center}
.strip-val{font-size:15px;font-weight:700}
.strip-lbl{font-size:10px;color:var(--muted);margin-top:2px}
.month-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.month-nav{background:var(--surface2);border:1px solid var(--border2);color:var(--text);border-radius:8px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px}
.month-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat-box{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.stat-box .val{font-size:20px;font-weight:700}
.stat-box .lbl{font-size:11px;color:var(--muted);margin-top:3px}
.day-row{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;cursor:pointer}
.day-row-date{font-size:13px;font-weight:700;min-width:50px}
.day-row-body{flex:1}
.day-row-hours{font-size:13px;font-weight:600;color:var(--cyan)}
.day-row-sub{font-size:11px;color:var(--muted);margin-top:2px}
.day-row-over{font-size:12px;font-weight:700;min-width:55px;text-align:right}
.empty{text-align:center;padding:48px 24px;color:var(--muted)}
.empty-icon{font-size:48px;margin-bottom:12px}
.empty-text{font-size:14px}
.fab{position:fixed;bottom:24px;right:20px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#1d4ed8,#3b82f6);border:none;color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(59,130,246,.5);cursor:pointer;z-index:200}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:300;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.open{opacity:1;pointer-events:all}
.sheet{background:var(--surface);border-radius:20px 20px 0 0;padding:20px 16px 40px;width:100%;max-height:90vh;overflow-y:auto;transform:translateY(40px);transition:transform .25s}
.overlay.open .sheet{transform:translateY(0)}
.handle{width:40px;height:4px;background:var(--dim);border-radius:4px;margin:0 auto 16px}
.sheet-title{font-size:17px;font-weight:700;margin-bottom:16px}
.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.action-btn{padding:14px 8px;border-radius:10px;border:none;font-family:inherit;font-weight:600;font-size:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}
.action-btn .ico{font-size:24px}
.ab-blue{background:#0c2040;border:1px solid rgba(59,130,246,.4);color:var(--blue)}
.ab-green{background:#052010;border:1px solid rgba(34,197,94,.4);color:var(--green)}
.ab-orange{background:#1a0e04;border:1px solid rgba(249,115,22,.4);color:var(--orange)}
.ab-purple{background:#120c1f;border:1px solid rgba(167,139,250,.4);color:var(--purple)}
.period-wrap{border-top:1px solid var(--border);padding-top:14px;margin-top:4px}
.ptabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.ptab{padding:7px 12px;border-radius:8px;border:1px solid var(--border2);background:none;color:var(--muted);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer}
.ptab.active{background:var(--blue);border-color:var(--blue);color:#fff}
.fullscreen{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;flex-direction:column}
.fs-bar{background:#1d4ed8;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.fs-bar-title{color:#fff;font-weight:700;font-size:15px}
.fs-btn{background:rgba(255,255,255,.2);color:#fff;border:none;padding:8px 14px;border-radius:8px;font-weight:700;font-size:12px;cursor:pointer;font-family:inherit}
.fs-btn-white{background:#fff;color:#1d4ed8;border:none;padding:8px 14px;border-radius:8px;font-weight:700;font-size:12px;cursor:pointer;font-family:inherit}
textarea.raw{flex:1;margin:0 12px 12px;background:#161e30;border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:11px;padding:12px;font-family:monospace;resize:none;outline:none}

/* LOGIN SCREEN */
.login-screen{position:fixed;inset:0;background:var(--bg);z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px}
.login-logo{font-size:64px;margin-bottom:16px}
.login-title{font-size:22px;font-weight:700;margin-bottom:8px;text-align:center}
.login-sub{font-size:14px;color:var(--muted);text-align:center;margin-bottom:32px;line-height:1.6}
.login-btn{background:linear-gradient(135deg,#1d4ed8,#3b82f6);color:#fff;border:none;padding:14px 32px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 4px 16px rgba(59,130,246,.4)}
.login-note{font-size:11px;color:var(--muted);text-align:center;margin-top:16px;line-height:1.6}

/* SYNC STATUS */
.sync-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.syncing{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

input[type=date]::-webkit-calendar-picker-indicator,input[type=time]::-webkit-calendar-picker-indicator{filter:invert(.5)}
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div class="login-screen" id="login-screen">
  <div class="login-logo">📋</div>
  <div class="login-title">Рабочий журнал</div>
  <div class="login-sub">Данные сохраняются в твой Google Drive.<br>Доступны с любого устройства и браузера.</div>
  <button class="login-btn" onclick="signIn()">🔑 Войти через Google</button>
  <div class="login-note">Приложение сохранит один файл<br>в твой Google Drive</div>
</div>

<div id="app" style="display:none">
  <div class="topbar">
    <div><h1>📋 Рабочий журнал</h1><p id="topDate"></p></div>
    <div style="display:flex;gap:6px;align-items:center">
      <span id="sync-status" style="font-size:11px;color:var(--muted)"></span>
      <button class="btn btn-ghost" onclick="openExport()" style="font-size:18px;padding:6px 10px">📤</button>
      <button class="btn btn-ghost" onclick="signOut()" style="font-size:12px;padding:6px 10px">Выйти</button>
      <button class="btn btn-primary" onclick="openNewDay()" style="padding:9px 14px;font-size:12px">+ День</button>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('today')" id="tab-today">Сегодня</div>
    <div class="tab" onclick="switchTab('month')" id="tab-month">Месяц</div>
    <div class="tab" onclick="switchTab('all')" id="tab-all">Все дни</div>
  </div>

  <div class="content" id="content"></div>
  <button class="fab" onclick="openNewDay()">+</button>
</div>

<!-- Day Modal -->
<div class="overlay" id="day-overlay" onclick="closeDayOverlay(event)">
  <div class="sheet">
    <div class="handle"></div>
    <div class="sheet-title" id="day-title">Новый день</div>
    <div id="day-form"></div>
  </div>
</div>

<!-- Export Modal -->
<div class="overlay" id="ex-overlay" onclick="closeExOverlay(event)">
  <div class="sheet">
    <div class="handle"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div class="sheet-title" style="margin-bottom:0">📤 Экспорт и отчёты</div>
      <button class="btn btn-ghost" onclick="closeExOverlay()">✕</button>
    </div>
    <div class="action-grid">
      <button class="action-btn ab-orange" onclick="doReport('print')"><span class="ico">🖨️</span>Печать/PDF</button>
      <button class="action-btn ab-purple" onclick="doReport('share')"><span class="ico">📨</span>Поделиться</button>
    </div>
    <div class="period-wrap">
      <div class="slabel" style="margin-bottom:10px">Период для отчёта</div>
      <div class="ptabs">
        <button class="ptab active" onclick="setPeriod('month',this)">Этот месяц</button>
        <button class="ptab" onclick="setPeriod('3m',this)">3 месяца</button>
        <button class="ptab" onclick="setPeriod('6m',this)">6 месяцев</button>
        <button class="ptab" onclick="setPeriod('year',this)">Год</button>
        <button class="ptab" onclick="setPeriod('custom',this)">Свой</button>
      </div>
      <div id="custom-range" style="display:none;margin-bottom:10px">
        <div class="grid2">
          <div class="field"><label>С</label><input type="date" id="range-from"></div>
          <div class="field"><label>По</label><input type="date" id="range-to"></div>
        </div>
      </div>
      <div id="period-info" style="font-size:12px;color:var(--muted)"></div>
    </div>
  </div>
</div>

<script>
// ===== CONFIG =====
var CLIENT_ID = '796026241753-bahbqfi6ac8m28g9dahjofbae68jh3jh.apps.googleusercontent.com';
var SCOPES = 'https://www.googleapis.com/auth/drive.appdata';
var FILE_NAME = 'work-journal-data.json';
var NORM = 480;

var data = [];
var tab = 'today';
var editId = null;
var curMonth = new Date().getMonth();
var curYear = new Date().getFullYear();
var period = 'month';
var formState = null;
var accessToken = null;
var driveFileId = null;
var saveTimer = null;

document.getElementById('topDate').textContent = new Date().toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});

// ===== GOOGLE AUTH =====
function signIn() {
  var client = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPES,
    callback: function(resp) {
      if (resp.error) { alert('Ошибка входа: ' + resp.error); return; }
      accessToken = resp.access_token;
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      loadFromDrive();
    }
  });
  client.requestAccessToken();
}

function signOut() {
  if (!confirm('Выйти из аккаунта?')) return;
  accessToken = null; driveFileId = null; data = [];
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
}

// ===== DRIVE API =====
function setSyncStatus(msg, spinning) {
  var el = document.getElementById('sync-status');
  el.textContent = msg;
  el.style.color = spinning ? 'var(--cyan)' : 'var(--muted)';
}

function loadFromDrive() {
  setSyncStatus('⟳ Загрузка...', true);
  fetch('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=files(id,name)&q=name%3D%22' + FILE_NAME + '%22', {
    headers: { 'Authorization': 'Bearer ' + accessToken }
  })
  .then(function(r){ return r.json(); })
  .then(function(res) {
    if (res.files && res.files.length > 0) {
      driveFileId = res.files[0].id;
      return fetch('https://www.googleapis.com/drive/v3/files/' + driveFileId + '?alt=media', {
        headers: { 'Authorization': 'Bearer ' + accessToken }
      }).then(function(r){ return r.json(); });
    } else {
      return null;
    }
  })
  .then(function(d) {
    if (d && Array.isArray(d)) { data = d; }
    setSyncStatus('✓ Синхронизировано', false);
    render();
  })
  .catch(function(e) {
    setSyncStatus('⚠ Ошибка загрузки', false);
    console.error(e);
    render();
  });
}

function saveToDrive() {
  if (!accessToken) return;
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(function() { doSaveToDrive(); }, 1000);
}

function doSaveToDrive() {
  setSyncStatus('⟳ Сохранение...', true);
  var json = JSON.stringify(data);
  var blob = new Blob([json], {type: 'application/json'});

  if (driveFileId) {
    // Update existing file
    fetch('https://www.googleapis.com/upload/drive/v3/files/' + driveFileId + '?uploadType=media', {
      method: 'PATCH',
      headers: { 'Authorization': 'Bearer ' + accessToken, 'Content-Type': 'application/json' },
      body: json
    })
    .then(function() { setSyncStatus('✓ Сохранено', false); })
    .catch(function() { setSyncStatus('⚠ Ошибка сохранения', false); });
  } else {
    // Create new file
    var meta = JSON.stringify({ name: FILE_NAME, parents: ['appDataFolder'] });
    var form = new FormData();
    form.append('metadata', new Blob([meta], {type:'application/json'}));
    form.append('file', blob);
    fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + accessToken },
      body: form
    })
    .then(function(r){ return r.json(); })
    .then(function(res) { driveFileId = res.id; setSyncStatus('✓ Сохранено', false); })
    .catch(function() { setSyncStatus('⚠ Ошибка сохранения', false); });
  }
}

function save() { saveToDrive(); }

// ===== HELPERS =====
function toMin(t){ if(!t)return 0; var p=t.split(':'); return parseInt(p[0])*60+parseInt(p[1]); }
function hm(m){ if(!m||m<=0)return'0ч 0м'; return Math.floor(Math.abs(m)/60)+'ч '+Math.abs(m)%60+'м'; }
function hmsign(m){ if(m===0)return'0'; return(m>0?'+':'-')+hm(Math.abs(m)); }
function fmtDate(s){ if(!s)return''; return new Date(s+'T00:00:00').toLocaleDateString('ru-RU',{weekday:'short',day:'numeric',month:'short'}); }
function fmtDateFull(s){ if(!s)return''; return new Date(s+'T00:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'}); }
function pad2(n){ return String(n).padStart(2,'0'); }

function calc(d){
  var total=(d.dayStart&&d.dayEnd)?toMin(d.dayEnd)-toMin(d.dayStart):0;
  var lunch=(d.lunchStart&&d.lunchEnd)?toMin(d.lunchEnd)-toMin(d.lunchStart):0;
  var work=total-lunch;
  var over=work-NORM;
  var objMin=(d.objects||[]).reduce(function(s,o){ return s+((o.ts&&o.te)?toMin(o.te)-toMin(o.ts):0); },0);
  var road=parseInt(d.roadMin)||0;
  return {work:work,over:over,objMin:objMin,road:road,lunch:lunch};
}

// ===== TABS =====
function switchTab(t){
  tab=t;
  document.querySelectorAll('.tab').forEach(function(el){el.classList.remove('active');});
  document.getElementById('tab-'+t).classList.add('active');
  render();
}

// ===== RENDER =====
function render(){
  var c=document.getElementById('content');
  if(tab==='today') renderToday(c);
  else if(tab==='month') renderMonth(c);
  else renderAll(c);
}

function renderToday(c){
  var today=new Date().toISOString().slice(0,10);
  var d=data.find(function(x){return x.date===today;});
  if(!d){ c.innerHTML='<div class="empty"><div class="empty-icon">📅</div><div class="empty-text">Сегодня записей нет.<br>Нажми + чтобы начать</div></div>'; return; }
  c.innerHTML=renderCard(d);
}

function renderAll(c){
  if(!data.length){ c.innerHTML='<div class="empty"><div class="empty-icon">📂</div><div class="empty-text">Нет записей</div></div>'; return; }
  var sorted=data.slice().sort(function(a,b){return b.date.localeCompare(a.date);});
  var tot=sorted.reduce(function(a,d){var cv=calc(d);a.work+=cv.work;a.over+=cv.over;a.km+=parseFloat(d.roadKm)||0;a.road+=cv.road;return a;},{work:0,over:0,km:0,road:0});
  var overColor=tot.over>0?'var(--orange)':tot.over<0?'var(--red)':'var(--green)';
  var html='<div class="summary-strip">'
    +'<div class="strip-cell"><div class="strip-val" style="color:var(--cyan)">'+hm(tot.work)+'</div><div class="strip-lbl">Часов</div></div>'
    +'<div class="strip-cell"><div class="strip-val" style="color:'+overColor+'">'+hmsign(tot.over)+'</div><div class="strip-lbl">Переработка</div></div>'
    +'<div class="strip-cell"><div class="strip-val" style="color:var(--orange)">'+Math.round(tot.km)+'</div><div class="strip-lbl">Км</div></div>'
    +'<div class="strip-cell"><div class="strip-val" style="color:var(--purple)">'+hm(tot.road)+'</div><div class="strip-lbl">В дороге</div></div>'
    +'</div>';
  sorted.forEach(function(d){ html+=renderCard(d); });
  c.innerHTML=html;
}

function renderCard(d){
  var cv=calc(d);
  var dot=cv.over>0?'var(--orange)':cv.over<0?'var(--red)':'var(--green)';
  var objs=d.objects||[];
  var objHTML='';
  objs.forEach(function(o,i){
    var om=(o.ts&&o.te)?toMin(o.te)-toMin(o.ts):0;
    objHTML+='<div class="obj-block">'
      +'<div class="obj-header"><span class="obj-num">ОБЪЕКТ '+(i+1)+(o.name?' — '+o.name:'')+'</span><span class="obj-badge">'+(om>0?hm(om):'')+'</span></div>'
      +'<div class="grid2" style="margin-bottom:6px">'
      +'<div class="field"><label>Начало</label><input type="time" value="'+(o.ts||'')+'" onchange="updObj(\''+d.id+'\',\''+o.id+'\',\'ts\',this.value)"></div>'
      +'<div class="field"><label>Конец</label><input type="time" value="'+(o.te||'')+'" onchange="updObj(\''+d.id+'\',\''+o.id+'\',\'te\',this.value)"></div>'
      +'</div>'
      +'<div class="field" style="margin-bottom:6px"><label>Задача</label><input type="text" value="'+(o.name||'')+'" placeholder="Что делали" onchange="updObj(\''+d.id+'\',\''+o.id+'\',\'name\',this.value)"></div>'
      +'<div class="field"><label>Заметка</label><input type="text" value="'+(o.note||'')+'" placeholder="Доп. инфо" onchange="updObj(\''+d.id+'\',\''+o.id+'\',\'note\',this.value)"></div>'
      +'</div>';
  });
  var overColor=cv.over>0?'var(--orange)':cv.over<0?'var(--red)':'var(--green)';
  var overBg=cv.over>0?'#f9731615':cv.over<0?'#ef444415':'#22c55e15';
  var overText=cv.over>0?'Переработка: +'+hm(cv.over):cv.over<0?'Недоработка: -'+hm(Math.abs(cv.over)):'✓ Норма выполнена';
  return '<div class="card" id="card-'+d.id+'">'
    +'<div class="card-header">'
    +'<div style="display:flex;align-items:center"><span class="card-dot" style="background:'+dot+'"></span><span class="card-date">'+fmtDate(d.date)+'</span></div>'
    +'<div style="display:flex;gap:8px"><button class="btn btn-ghost" onclick="editDay(\''+d.id+'\')">✎</button><button class="btn btn-danger" onclick="delDay(\''+d.id+'\')">✕</button></div>'
    +'</div>'
    +'<div class="section"><div class="slabel">🕐 Рабочий день</div>'
    +'<div class="grid2" style="margin-bottom:8px">'
    +'<div class="field"><label>Начало</label><input type="time" value="'+(d.dayStart||'')+'" onchange="updDay(\''+d.id+'\',\'dayStart\',this.value)"></div>'
    +'<div class="field"><label>Конец</label><input type="time" value="'+(d.dayEnd||'')+'" onchange="updDay(\''+d.id+'\',\'dayEnd\',this.value)"></div>'
    +'</div><div class="grid2">'
    +'<div class="field"><label>Обед нач.</label><input type="time" value="'+(d.lunchStart||'')+'" onchange="updDay(\''+d.id+'\',\'lunchStart\',this.value)"></div>'
    +'<div class="field"><label>Обед кон.</label><input type="time" value="'+(d.lunchEnd||'')+'" onchange="updDay(\''+d.id+'\',\'lunchEnd\',this.value)"></div>'
    +'</div></div>'
    +'<div class="section"><div class="slabel">🚗 Дорога</div><div class="grid2">'
    +'<div class="field"><label>Км</label><input type="number" value="'+(d.roadKm||'')+'" placeholder="0" onchange="updDay(\''+d.id+'\',\'roadKm\',this.value)"></div>'
    +'<div class="field"><label>Мин в дороге</label><input type="number" value="'+(d.roadMin||'')+'" placeholder="0" onchange="updDay(\''+d.id+'\',\'roadMin\',this.value)"></div>'
    +'</div></div>'
    +'<div class="section">'
    +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">'
    +'<div class="slabel" style="margin-bottom:0">📍 Объекты</div><button class="btn-add" onclick="addObj(\''+d.id+'\')">+ Объект</button>'
    +'</div>'+objHTML+'</div>'
    +'<div style="background:var(--bg);border-radius:10px;padding:12px;border:1px solid var(--border)">'
    +'<div class="slabel">📊 Итог</div>'
    +'<div class="result-row"><span class="result-label">На объектах</span><span class="result-val" style="color:var(--cyan)">'+hm(cv.objMin)+'</span></div>'
    +'<div class="result-row"><span class="result-label">В дороге</span><span class="result-val" style="color:var(--purple)">'+hm(cv.road)+'</span></div>'
    +'<div class="result-row"><span class="result-label">Обед</span><span class="result-val" style="color:var(--muted)">'+hm(cv.lunch)+'</span></div>'
    +'<div class="result-row"><span class="result-label">Рабочих часов</span><span class="result-val">'+hm(cv.work)+'</span></div>'
    +(d.roadKm?'<div class="result-row"><span class="result-label">Километраж</span><span class="result-val" style="color:var(--orange)">'+d.roadKm+' км</span></div>':'')
    +'<div class="over-box" style="background:'+overBg+'"><span style="font-size:13px;font-weight:600;color:'+overColor+'">'+overText+'</span></div>'
    +'</div></div>';
}

function renderMonth(c){
  var MN=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  var days=data.filter(function(d){var dt=new Date(d.date+'T00:00:00');return dt.getMonth()===curMonth&&dt.getFullYear()===curYear;}).sort(function(a,b){return b.date.localeCompare(a.date);});
  var tot=days.reduce(function(a,d){var cv=calc(d);a.work+=cv.work;a.over+=cv.over;a.km+=parseFloat(d.roadKm)||0;return a;},{work:0,over:0,km:0});
  var overColor=tot.over>0?'var(--orange)':tot.over<0?'var(--red)':'var(--green)';
  var html='<div class="month-header">'
    +'<button class="month-nav" onclick="prevMonth()">‹</button>'
    +'<div style="font-size:16px;font-weight:700">'+MN[curMonth]+' '+curYear+'</div>'
    +'<button class="month-nav" onclick="nextMonth()">›</button>'
    +'</div>'
    +'<div class="month-stats">'
    +'<div class="stat-box"><div class="val" style="color:var(--cyan)">'+hm(tot.work)+'</div><div class="lbl">Рабочих часов</div></div>'
    +'<div class="stat-box"><div class="val" style="color:'+overColor+'">'+hmsign(tot.over)+'</div><div class="lbl">Переработка</div></div>'
    +'<div class="stat-box"><div class="val" style="color:var(--orange)">'+Math.round(tot.km)+' км</div><div class="lbl">Пробег</div></div>'
    +'<div class="stat-box"><div class="val" style="color:var(--muted)">'+days.length+'</div><div class="lbl">Рабочих дней</div></div>'
    +'</div>';
  if(!days.length){
    html+='<div class="empty"><div class="empty-icon">📅</div><div class="empty-text">Нет записей за этот месяц</div></div>';
  } else {
    days.forEach(function(d){
      var cv=calc(d);
      var oc=cv.over>0?'var(--orange)':cv.over<0?'var(--red)':'var(--green)';
      var objs=(d.objects||[]).filter(function(o){return o.name;}).map(function(o){return o.name;}).join(', ');
      html+='<div class="day-row" onclick="goDay(\''+d.id+'\')"><div class="day-row-date">'+new Date(d.date+'T00:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'short'})+'</div>'
        +'<div class="day-row-body"><div class="day-row-hours">'+hm(cv.work)+'</div>'
        +(objs?'<div class="day-row-sub">'+objs+'</div>':'')
        +(d.roadKm?'<div class="day-row-sub" style="color:var(--orange)">🚗 '+d.roadKm+' км</div>':'')
        +'</div><div class="day-row-over" style="color:'+oc+'">'+(cv.over!==0?hmsign(cv.over):'✓')+'</div></div>';
    });
  }
  c.innerHTML=html;
}

function prevMonth(){ curMonth--; if(curMonth<0){curMonth=11;curYear--;} render(); }
function nextMonth(){ curMonth++; if(curMonth>11){curMonth=0;curYear++;} render(); }
function goDay(id){ switchTab('all'); setTimeout(function(){var el=document.getElementById('card-'+id);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});},100); }

// ===== INLINE EDIT =====
function updDay(id,field,val){ var d=data.find(function(x){return x.id===id;}); if(d){d[field]=val;save();reCard(id);} }
function updObj(dayId,objId,field,val){ var d=data.find(function(x){return x.id===dayId;}); if(d){var o=d.objects.find(function(x){return x.id===objId;});if(o){o[field]=val;save();reCard(dayId);}} }
function addObj(dayId){ var d=data.find(function(x){return x.id===dayId;}); if(d){d.objects.push({id:Date.now()+'',name:'',ts:'',te:'',note:''});save();reCard(dayId);} }
function reCard(id){ var d=data.find(function(x){return x.id===id;}); if(!d)return; var el=document.getElementById('card-'+id); if(el){var tmp=document.createElement('div');tmp.innerHTML=renderCard(d);el.replaceWith(tmp.firstChild);} }
function delDay(id){ if(!confirm('Удалить этот день?'))return; data=data.filter(function(x){return x.id!==id;}); save(); render(); }

// ===== FORM =====
function openNewDay(){
  editId=null;
  var today=new Date().toISOString().slice(0,10);
  formState={id:Date.now()+'',date:today,dayStart:'',dayEnd:'',lunchStart:'',lunchEnd:'',roadKm:'',roadMin:'',objects:[{id:Date.now()+'x',name:'',ts:'',te:'',note:''}]};
  document.getElementById('day-title').textContent='Новый день';
  document.getElementById('day-overlay').classList.add('open');
  renderForm();
}
function editDay(id){ editId=id; var d=data.find(function(x){return x.id===id;}); if(d){formState=JSON.parse(JSON.stringify(d));document.getElementById('day-title').textContent='Редактировать день';document.getElementById('day-overlay').classList.add('open');renderForm();} }
function closeDayOverlay(e){ if(e&&e.target!==document.getElementById('day-overlay'))return; document.getElementById('day-overlay').classList.remove('open'); render(); }

function renderForm(){
  var d=formState;
  var objHTML='';
  (d.objects||[]).forEach(function(o,i){
    objHTML+='<div class="obj-block">'
      +'<div class="obj-header"><span class="obj-num">ОБЪЕКТ '+(i+1)+'</span>'+(i>0?'<button class="btn btn-danger" onclick="rmFormObj(\''+o.id+'\')">✕</button>':'')+'</div>'
      +'<div class="grid2" style="margin-bottom:8px">'
      +'<div class="field"><label>Начало</label><input type="time" value="'+(o.ts||'')+'" onchange="fObj(\''+o.id+'\',\'ts\',this.value)"></div>'
      +'<div class="field"><label>Конец</label><input type="time" value="'+(o.te||'')+'" onchange="fObj(\''+o.id+'\',\'te\',this.value)"></div>'
      +'</div>'
      +'<div class="field" style="margin-bottom:6px"><label>Задача</label><input type="text" value="'+(o.name||'')+'" placeholder="Что делали" onchange="fObj(\''+o.id+'\',\'name\',this.value)"></div>'
      +'<div class="field"><label>Заметка</label><input type="text" value="'+(o.note||'')+'" placeholder="Доп. инфо" onchange="fObj(\''+o.id+'\',\'note\',this.value)"></div>'
      +'</div>';
  });
  document.getElementById('day-form').innerHTML=
    '<div class="section"><div class="slabel">📅 Дата</div><div class="field"><input type="date" value="'+(d.date||'')+'" onchange="formState.date=this.value"></div></div>'
    +'<div class="section"><div class="slabel">🕐 Рабочий день</div>'
    +'<div class="grid2" style="margin-bottom:8px">'
    +'<div class="field"><label>Начало</label><input type="time" value="'+(d.dayStart||'')+'" onchange="formState.dayStart=this.value"></div>'
    +'<div class="field"><label>Конец</label><input type="time" value="'+(d.dayEnd||'')+'" onchange="formState.dayEnd=this.value"></div>'
    +'</div><div class="grid2">'
    +'<div class="field"><label>Обед нач.</label><input type="time" value="'+(d.lunchStart||'')+'" onchange="formState.lunchStart=this.value"></div>'
    +'<div class="field"><label>Обед кон.</label><input type="time" value="'+(d.lunchEnd||'')+'" onchange="formState.lunchEnd=this.value"></div>'
    +'</div></div>'
    +'<div class="section"><div class="slabel">🚗 Дорога</div><div class="grid2">'
    +'<div class="field"><label>Км</label><input type="number" value="'+(d.roadKm||'')+'" placeholder="0" onchange="formState.roadKm=this.value"></div>'
    +'<div class="field"><label>Мин в дороге</label><input type="number" value="'+(d.roadMin||'')+'" placeholder="0" onchange="formState.roadMin=this.value"></div>'
    +'</div></div>'
    +'<div class="section"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">'
    +'<div class="slabel" style="margin-bottom:0">📍 Объекты</div><button class="btn-add" onclick="addFormObj()">+ Объект</button></div>'
    +objHTML+'</div>'
    +'<button class="btn btn-primary" style="width:100%;margin-top:8px" onclick="saveDay()">💾 Сохранить</button>'
    +'<div style="height:16px"></div>';
}

function fObj(id,field,val){ var o=formState.objects.find(function(x){return x.id===id;}); if(o)o[field]=val; }
function addFormObj(){ formState.objects.push({id:Date.now()+'fo',name:'',ts:'',te:'',note:''}); renderForm(); }
function rmFormObj(id){ if(formState.objects.length<=1)return; formState.objects=formState.objects.filter(function(o){return o.id!==id;}); renderForm(); }

function saveDay(){
  if(editId){
    var idx=data.findIndex(function(x){return x.id===editId;});
    if(idx>=0)data[idx]=formState;
  } else {
    var exists=data.findIndex(function(x){return x.date===formState.date;});
    if(exists>=0){
      var fmt=new Date(formState.date+'T00:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
      if(!confirm('За '+fmt+' уже есть запись!\nСтарые данные будут заменены. Продолжить?'))return;
      data[exists]=formState;
    } else { data.push(formState); }
  }
  save();
  document.getElementById('day-overlay').classList.remove('open');
  var today=new Date().toISOString().slice(0,10);
  if(formState.date===today)switchTab('today'); else render();
}

// ===== EXPORT =====
function openExport(){ updatePeriodInfo(); document.getElementById('ex-overlay').classList.add('open'); }
function closeExOverlay(e){ if(e&&e.target!==document.getElementById('ex-overlay'))return; document.getElementById('ex-overlay').classList.remove('open'); }

function setPeriod(p,btn){
  period=p;
  document.querySelectorAll('.ptab').forEach(function(t){t.classList.remove('active');});
  btn.classList.add('active');
  document.getElementById('custom-range').style.display=p==='custom'?'block':'none';
  updatePeriodInfo();
}

function getPeriodDays(){
  var now=new Date();
  var from,toD=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  if(period==='month') from=new Date(now.getFullYear(),now.getMonth(),1);
  else if(period==='3m') from=new Date(now.getFullYear(),now.getMonth()-2,1);
  else if(period==='6m') from=new Date(now.getFullYear(),now.getMonth()-5,1);
  else if(period==='year') from=new Date(now.getFullYear(),0,1);
  else {
    var f=document.getElementById('range-from').value;
    var t2=document.getElementById('range-to').value;
    if(!f||!t2){alert('Укажи период');return null;}
    from=new Date(f+'T00:00:00'); toD=new Date(t2+'T00:00:00');
  }
  var fs=from.toISOString().slice(0,10);
  var ts=toD.toISOString().slice(0,10);
  return data.filter(function(d){return d.date>=fs&&d.date<=ts;}).sort(function(a,b){return a.date.localeCompare(b.date);});
}

function updatePeriodInfo(){
  var days=getPeriodDays();
  var el=document.getElementById('period-info');
  if(!el||!days)return;
  var tot=days.reduce(function(a,d){var cv=calc(d);a.work+=cv.work;a.over+=cv.over;a.km+=parseFloat(d.roadKm)||0;return a;},{work:0,over:0,km:0});
  el.textContent='Дней: '+days.length+' · '+hm(tot.work)+' · Переработка: '+hmsign(tot.over)+' · '+Math.round(tot.km)+' км';
}

function doReport(mode){
  var days=getPeriodDays();
  if(!days||!days.length){alert('За выбранный период записей нет');return;}
  var MN=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  var tot=days.reduce(function(a,d){var cv=calc(d);a.work+=cv.work;a.over+=cv.over;a.km+=parseFloat(d.roadKm)||0;a.road+=cv.road;return a;},{work:0,over:0,km:0,road:0});
  var f=fmtDateFull(days[0].date), t2=fmtDateFull(days[days.length-1].date);

  if(mode==='share'){
    var txt='РАБОЧИЙ ЖУРНАЛ\n'+f+' — '+t2+'\n———————————————\n';
    txt+='Дней: '+days.length+'\nЧасов: '+hm(tot.work)+'\nПереработка: '+hmsign(tot.over)+'\nПробег: '+Math.round(tot.km)+' км\n\n';
    days.forEach(function(d){
      var cv=calc(d);
      var dt=new Date(d.date+'T00:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'short'});
      var objs=(d.objects||[]).filter(function(o){return o.name;}).map(function(o){return o.name;}).join(', ');
      txt+=dt+': '+hm(cv.work)+(cv.over>0?' (+'+hm(cv.over)+')':cv.over<0?' (-'+hm(Math.abs(cv.over))+')':'')+(d.roadKm?' · '+d.roadKm+'км':'')+(objs?' · '+objs:'')+'\n';
    });
    if(navigator.share){navigator.share({title:'Рабочий журнал',text:txt}).catch(function(){copyText(txt);});}
    else{copyText(txt);}
    return;
  }

  var byMonth={};
  days.forEach(function(d){
    var dt=new Date(d.date+'T00:00:00');
    var key=dt.getFullYear()+'-'+pad2(dt.getMonth());
    if(!byMonth[key])byMonth[key]={label:MN[dt.getMonth()]+' '+dt.getFullYear(),days:[]};
    byMonth[key].days.push(d);
  });

  var html='<div style="font-family:Arial,sans-serif;font-size:12px;color:#111;padding:16px;max-width:700px;margin:0 auto">'
    +'<h2 style="font-size:16px;margin-bottom:4px">Рабочий журнал</h2>'
    +'<div style="font-size:11px;color:#666;margin-bottom:14px">'+f+' — '+t2+'</div>'
    +'<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:#f5f5f5;border-radius:8px;padding:12px;margin-bottom:16px">'
    +'<div style="text-align:center"><div style="font-size:16px;font-weight:700;color:#1d4ed8">'+days.length+'</div><div style="font-size:10px;color:#666">Дней</div></div>'
    +'<div style="text-align:center"><div style="font-size:16px;font-weight:700;color:#1d4ed8">'+hm(tot.work)+'</div><div style="font-size:10px;color:#666">Часов</div></div>'
    +'<div style="text-align:center"><div style="font-size:16px;font-weight:700;color:'+(tot.over>0?'#c2410c':'#166534')+'">'+hmsign(tot.over)+'</div><div style="font-size:10px;color:#666">Переработка</div></div>'
    +'<div style="text-align:center"><div style="font-size:16px;font-weight:700;color:#c2410c">'+Math.round(tot.km)+' км</div><div style="font-size:10px;color:#666">Пробег</div></div>'
    +'</div>';

  Object.keys(byMonth).forEach(function(k){
    var m=byMonth[k];
    var mt=m.days.reduce(function(a,d){var cv=calc(d);a.work+=cv.work;a.over+=cv.over;a.km+=parseFloat(d.roadKm)||0;return a;},{work:0,over:0,km:0});
    html+='<div style="margin-bottom:16px">'
      +'<div style="background:#1d4ed8;color:#fff;padding:6px 12px;border-radius:6px 6px 0 0;font-weight:700">'+m.label+'</div>'
      +'<div style="background:#e8f0fe;padding:5px 12px;font-size:11px;margin-bottom:6px">Дней: '+m.days.length+' · '+hm(mt.work)+' · Переработка: '+hmsign(mt.over)+' · '+Math.round(mt.km)+' км</div>'
      +'<table style="width:100%;border-collapse:collapse;font-size:11px">'
      +'<tr style="background:#f0f0f0"><th style="padding:5px 8px;text-align:left;border-bottom:2px solid #ddd">Дата</th><th style="padding:5px 8px;text-align:left;border-bottom:2px solid #ddd">Часов</th><th style="padding:5px 8px;text-align:left;border-bottom:2px solid #ddd">Переработка</th><th style="padding:5px 8px;text-align:left;border-bottom:2px solid #ddd">Объекты</th><th style="padding:5px 8px;text-align:left;border-bottom:2px solid #ddd">Км</th></tr>';
    m.days.forEach(function(d){
      var cv=calc(d);
      var dt=new Date(d.date+'T00:00:00').toLocaleDateString('ru-RU',{weekday:'short',day:'numeric',month:'short'});
      var objs=(d.objects||[]).map(function(o){return o.name||'';}).filter(Boolean).join(', ');
      var oc=cv.over>0?'#c2410c':'#166534';
      html+='<tr style="border-bottom:1px solid #eee">'
        +'<td style="padding:5px 8px;font-weight:700">'+dt+'</td>'
        +'<td style="padding:5px 8px">'+hm(cv.work)+'</td>'
        +'<td style="padding:5px 8px;color:'+oc+';font-weight:600">'+(cv.over!==0?hmsign(cv.over):'✓')+'</td>'
        +'<td style="padding:5px 8px">'+(objs||'—')+'</td>'
        +'<td style="padding:5px 8px">'+(d.roadKm?d.roadKm+' км':'—')+'</td>'
        +'</tr>';
    });
    html+='</table></div>';
  });
  html+='</div>';

  var fs=document.createElement('div');
  fs.className='fullscreen'; fs.id='fs-report'; fs.style.background='#fff';
  fs.innerHTML='<div class="fs-bar"><span class="fs-bar-title">📋 Отчёт</span>'
    +'<div style="display:flex;gap:8px">'
    +'<button class="fs-btn-white" onclick="window.print()">🖨️ Печать/PDF</button>'
    +'<button class="fs-btn" onclick="document.getElementById(\'fs-report\').remove()">✕</button>'
    +'</div></div>'
    +'<div style="overflow-y:auto;flex:1">'+html+'</div>';
  document.body.appendChild(fs);
}

function copyText(txt){
  if(navigator.clipboard){navigator.clipboard.writeText(txt).then(function(){alert('Скопировано!');}).catch(function(){fbCopy(txt);});}
  else{fbCopy(txt);}
}
function fbCopy(txt){ var ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); alert('Скопировано!'); }
</script>
</body>
</html>
